[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-voice-assistant"
version = "0.1.0"
description = "Voice assistant that learns reusable runbooks from successful agent trajectories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5,<1",
]
sailbox = [
  "sail>=0.5.6,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  # schema/validate.py and the trajectory tests both check emitted JSON against
  # the locked schemas rather than eyeballing them.
  "jsonschema>=4.0",
]

[project.scripts]
runbook-branch-search-demo = "runbook_voice.branch_search_demo:main"
runbook-cold-task-demo = "runbook_voice.cold_task_demo:main"
runbook-sailbox-demo = "runbook_voice.sailbox_demo:main"
runbook-voice-echo = "runbook_voice.voice_loop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
